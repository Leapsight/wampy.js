<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wampy OIDC Cookie Demo</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fafafa}
h1{font-size:1.4rem;margin-bottom:.25rem}
h2{font-size:1.1rem;margin:1.5rem 0 .5rem}
.subtitle{color:#666;margin-top:0;font-size:.9rem}
label{font-weight:600;font-size:.85rem}
select,input,button{font-size:.85rem;padding:.4rem .7rem;border:1px solid #ccc;border-radius:4px}
select{background:#fff}
button{cursor:pointer;background:#2563eb;color:#fff;border:none;border-radius:4px;padding:.45rem 1rem;font-weight:600}
button:hover{background:#1d4ed8}
button:disabled{background:#94a3b8;cursor:not-allowed}
button.danger{background:#dc2626}
button.danger:hover{background:#b91c1c}
button.secondary{background:#6b7280}
button.secondary:hover{background:#4b5563}
.row{display:flex;align-items:center;gap:.75rem;margin:.5rem 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem 1.25rem;margin:.75rem 0}
.hidden{display:none}
#log{font-family:'SF Mono',Menlo,Monaco,monospace;font-size:.78rem;line-height:1.5;background:#0f172a;color:#e2e8f0;border-radius:6px;padding:.75rem 1rem;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;margin-top:.75rem}
.log-info{color:#38bdf8}
.log-ok{color:#4ade80}
.log-warn{color:#fbbf24}
.log-err{color:#f87171}
.log-event{color:#c084fc}
.status{display:inline-block;padding:.15rem .5rem;border-radius:10px;font-size:.75rem;font-weight:600}
.status.off{background:#fee2e2;color:#991b1b}
.status.on{background:#dcfce7;color:#166534}
.cookie-info{font-size:.8rem;color:#475569;background:#f1f5f9;padding:.5rem .75rem;border-radius:4px;margin:.5rem 0}
</style>
</head>
<body>

<h1>Wampy.js &mdash; OIDC Cookie Demo</h1>
<p class="subtitle">Login via OIDC, then connect to Bondy over Longpoll or SSE using cookie-based auth.</p>

<!-- Login Section -->
<div class="card" id="login-section">
    <h2 style="margin-top:0">1. Login</h2>
    <div class="row">
        <label for="transport-select">Transport:</label>
        <select id="transport-select">
            <option value="longpoll">Longpoll</option>
            <option value="sse">SSE</option>
        </select>
    </div>
    <div class="row">
        <label for="realm-input">Realm:</label>
        <input id="realm-input" type="text" value="com.leapsight.test" style="flex:1">
    </div>
    <div class="row">
        <label for="client-id-input">Client ID:</label>
        <input id="client-id-input" type="text" value="my-app" style="flex:1">
    </div>
    <div class="row">
        <label for="device-id-input">Device ID:</label>
        <input id="device-id-input" type="text" value="browser-abc" style="flex:1">
    </div>
    <div class="row">
        <label for="login-url-input">Login URL:</label>
        <input id="login-url-input" type="text"
               value="https://localhost:18083/api/v1.0/oidc/login?provider=mock"
               style="flex:1">
    </div>
    <div class="row">
        <label for="logout-url-input">Logout URL:</label>
        <input id="logout-url-input" type="text"
               value="https://localhost:18083/api/v1.0/oidc/logout"
               style="flex:1">
    </div>
    <div class="row" style="margin-top:.75rem">
        <button id="login-btn">Login with OIDC</button>
        <button id="logout-btn" class="danger">Logout</button>
        <span id="login-status" class="status off">Not logged in</span>
    </div>
    <div id="cookie-display" class="cookie-info hidden"></div>
</div>

<!-- WAMP Section -->
<div class="card" id="wamp-section">
    <h2 style="margin-top:0">2. WAMP Session</h2>
    <div class="row">
        <button id="connect-btn" disabled>Connect</button>
        <button id="disconnect-btn" class="danger" disabled>Disconnect</button>
        <span id="wamp-status" class="status off">Disconnected</span>
    </div>
</div>

<!-- Pub/Sub Section -->
<div class="card" id="pubsub-section">
    <h2 style="margin-top:0">3. Pub/Sub</h2>
    <div class="row">
        <label for="topic-input">Topic:</label>
        <input id="topic-input" type="text" value="com.example.topic1" style="flex:1">
    </div>
    <div class="row">
        <button id="subscribe-btn" disabled>Subscribe</button>
        <button id="unsubscribe-btn" class="secondary" disabled>Unsubscribe</button>
    </div>
    <div class="row">
        <label for="publish-input">Payload:</label>
        <input id="publish-input" type="text" value="hello world" style="flex:1">
        <button id="publish-btn" disabled>Publish</button>
    </div>
</div>

<!-- Log -->
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">Log</h2>
        <button class="secondary" onclick="document.getElementById('log').textContent=''">Clear</button>
    </div>
    <div id="log"></div>
</div>

<script src="../dist/browser/wampy.js"></script>
<script>
(function () {
    'use strict';

    // -----------------------------------------------------------------------
    // Configuration
    // -----------------------------------------------------------------------
    const LONGPOLL_BASE = 'https://localhost:18083/wamp/longpoll';
    const SSE_BASE      = 'https://localhost:18083/wamp/sse';

    // -----------------------------------------------------------------------
    // DOM refs
    // -----------------------------------------------------------------------
    const $transportSel   = document.getElementById('transport-select');
    const $realmInput     = document.getElementById('realm-input');
    const $clientIdInput  = document.getElementById('client-id-input');
    const $deviceIdInput  = document.getElementById('device-id-input');
    const $loginUrlInput  = document.getElementById('login-url-input');
    const $logoutUrlInput = document.getElementById('logout-url-input');
    const $loginBtn       = document.getElementById('login-btn');
    const $logoutBtn      = document.getElementById('logout-btn');
    const $loginStatus    = document.getElementById('login-status');
    const $cookieDisplay  = document.getElementById('cookie-display');
    const $connectBtn     = document.getElementById('connect-btn');
    const $disconnectBtn  = document.getElementById('disconnect-btn');
    const $wampStatus     = document.getElementById('wamp-status');
    const $topicInput     = document.getElementById('topic-input');
    const $subscribeBtn   = document.getElementById('subscribe-btn');
    const $unsubscribeBtn = document.getElementById('unsubscribe-btn');
    const $publishInput   = document.getElementById('publish-input');
    const $publishBtn     = document.getElementById('publish-btn');
    const $log            = document.getElementById('log');

    // -----------------------------------------------------------------------
    // State
    // -----------------------------------------------------------------------
    let wampy = null;               // Wampy instance
    let subscriptionId = null;      // active WAMP subscription id

    // -----------------------------------------------------------------------
    // Logging
    // -----------------------------------------------------------------------
    function log (msg, cls) {
        const ts = new Date().toISOString().slice(11, 23);
        const span = document.createElement('span');
        if (cls) span.className = cls;
        span.textContent = `[${ts}] ${msg}\n`;
        $log.appendChild(span);
        $log.scrollTop = $log.scrollHeight;
    }

    // -----------------------------------------------------------------------
    // Cookie helpers
    // -----------------------------------------------------------------------
    function getCookie (name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
    }

    function isLoggedIn () {
        // Try reading the cookie directly (works if not HttpOnly)
        if (getCookie('bondy_ticket') !== null) {
            localStorage.setItem('oidc_demo_logged_in', '1');
            return true;
        }
        // Fall back to localStorage flag (set after OIDC redirect)
        return localStorage.getItem('oidc_demo_logged_in') === '1';
    }

    function csrfHeaders () {
        const csrf = getCookie('bondy_csrf');
        return csrf ? { 'X-CSRF-Token': csrf } : {};
    }

    // -----------------------------------------------------------------------
    // UI Logic
    // -----------------------------------------------------------------------

    // Restore preferences from localStorage
    const saved = localStorage.getItem('oidc_demo_transport');
    if (saved) $transportSel.value = saved;

    const savedRealm = localStorage.getItem('oidc_demo_realm');
    if (savedRealm) $realmInput.value = savedRealm;

    function updateLoginUI () {
        const loggedIn = isLoggedIn();
        if (loggedIn) {
            $loginStatus.textContent = 'Logged in';
            $loginStatus.className = 'status on';
            $connectBtn.disabled = false;
            const ticket = getCookie('bondy_ticket');
            const csrf = getCookie('bondy_csrf');
            $cookieDisplay.classList.remove('hidden');
            $cookieDisplay.textContent =
                'bondy_ticket: ' + (ticket ? ticket.slice(0, 20) + '...' : '(not set)') +
                '\nbondy_csrf: ' + (csrf || '(not set)');
            log('Cookies detected — ready to connect', 'log-ok');
        } else {
            $loginStatus.textContent = 'Not logged in';
            $loginStatus.className = 'status off';
            $connectBtn.disabled = true;
            $cookieDisplay.classList.add('hidden');
        }
    }

    function setWampUI (connected) {
        $connectBtn.disabled = connected;
        $disconnectBtn.disabled = !connected;
        $subscribeBtn.disabled = !connected;
        $publishBtn.disabled = !connected;
        $wampStatus.textContent = connected ? 'Connected' : 'Disconnected';
        $wampStatus.className = connected ? 'status on' : 'status off';
        if (!connected) {
            $unsubscribeBtn.disabled = true;
            subscriptionId = null;
        }
    }

    // -- Login button -------------------------------------------------------
    $loginBtn.addEventListener('click', () => {
        localStorage.setItem('oidc_demo_transport', $transportSel.value);
        localStorage.setItem('oidc_demo_realm', $realmInput.value);
        localStorage.setItem('oidc_demo_logged_in', '1');

        const loginUrl = $loginUrlInput.value.trim();
        const clientId = $clientIdInput.value.trim();
        const deviceId = $deviceIdInput.value.trim();
        const redirectUri = window.location.href.split('?')[0];
        const sep = loginUrl.includes('?') ? '&' : '?';
        window.location.href = loginUrl + sep +
            'client_id=' + encodeURIComponent(clientId) +
            '&device_id=' + encodeURIComponent(deviceId) +
            '&redirect_uri=' + encodeURIComponent(redirectUri);
    });

    // -- Logout button ------------------------------------------------------
    $logoutBtn.addEventListener('click', async () => {
        // Disconnect WAMP session if active
        if (wampy) {
            try { await wampy.disconnect(); } catch (e) { /* ignore */ }
            wampy = null;
        }
        // Clear login state before navigating away
        localStorage.removeItem('oidc_demo_logged_in');
        // Navigate to logout endpoint (GET); Bondy revokes the ticket,
        // clears HttpOnly cookies via Set-Cookie, and 302 redirects back.
        const logoutUrl = $logoutUrlInput.value.trim();
        const redirectUri = window.location.href.split('?')[0];
        const sep = logoutUrl.includes('?') ? '&' : '?';
        window.location.href = logoutUrl + sep +
            'redirect_uri=' + encodeURIComponent(redirectUri);
    });

    // -- Connect button -----------------------------------------------------
    $connectBtn.addEventListener('click', async () => {
        const transport = $transportSel.value;
        const realm = $realmInput.value.trim();
        const baseUrl = transport === 'sse' ? SSE_BASE : LONGPOLL_BASE;

        log('Connecting via ' + transport + ' to realm ' + realm + ' ...', 'log-info');
        $connectBtn.disabled = true;

        try {
            wampy = new Wampy(baseUrl, {
                realm: realm,
                transport: transport,
                additionalHeaders: csrfHeaders(),
                withCredentials: true,
                autoReconnect: false,
                onClose: () => {
                    log('Connection closed', 'log-warn');
                    setWampUI(false);
                    $connectBtn.disabled = !isLoggedIn();
                },
                onError: (err) => {
                    log('Error: ' + (err.message || JSON.stringify(err)), 'log-err');
                }
            });

            await wampy.connect();
            log('Session established  id=' + wampy.getSessionId(), 'log-ok');
            setWampUI(true);
        } catch (e) {
            log('Connect failed: ' + (e.message || e), 'log-err');
            wampy = null;
            setWampUI(false);
            $connectBtn.disabled = !isLoggedIn();
        }
    });

    // -- Disconnect button --------------------------------------------------
    $disconnectBtn.addEventListener('click', async () => {
        if (!wampy) return;
        try {
            await wampy.disconnect();
        } catch (e) {
            log('Disconnect error: ' + e.message, 'log-warn');
        }
        wampy = null;
        setWampUI(false);
        $connectBtn.disabled = !isLoggedIn();
        log('Disconnected', 'log-info');
    });

    // -- Subscribe button ---------------------------------------------------
    $subscribeBtn.addEventListener('click', async () => {
        if (!wampy) return;
        const topic = $topicInput.value.trim();
        if (!topic) return;

        try {
            const result = await wampy.subscribe(topic, (event) => {
                log('Received: ' + JSON.stringify(event.argsList) +
                    (event.argsDict && Object.keys(event.argsDict).length
                        ? ' kw=' + JSON.stringify(event.argsDict) : ''),
                    'log-event');
            });
            subscriptionId = result.subscriptionId;
            log('Subscribed  topic=' + topic + '  subId=' + subscriptionId, 'log-ok');
            $unsubscribeBtn.disabled = false;
        } catch (e) {
            log('Subscribe failed: ' + (e.message || e), 'log-err');
        }
    });

    // -- Unsubscribe button -------------------------------------------------
    $unsubscribeBtn.addEventListener('click', async () => {
        if (!wampy || !subscriptionId) return;
        try {
            await wampy.unsubscribe(subscriptionId);
            log('Unsubscribed  subId=' + subscriptionId, 'log-ok');
            subscriptionId = null;
            $unsubscribeBtn.disabled = true;
        } catch (e) {
            log('Unsubscribe failed: ' + (e.message || e), 'log-err');
        }
    });

    // -- Publish button -----------------------------------------------------
    $publishBtn.addEventListener('click', async () => {
        if (!wampy) return;
        const topic = $topicInput.value.trim();
        const payload = $publishInput.value;
        if (!topic) return;

        try {
            await wampy.publish(topic, { argsList: [payload] }, { exclude_me: false });
            log('Published  topic=' + topic, 'log-ok');
        } catch (e) {
            log('Publish failed: ' + (e.errorUri || e.message || e), 'log-err');
        }
    });

    // -- Init ---------------------------------------------------------------
    // Detect return from OIDC login redirect
    if (document.referrer && new URL(document.referrer).origin !== window.location.origin) {
        localStorage.setItem('oidc_demo_logged_in', '1');
    }
    updateLoginUI();
    setWampUI(false);

})();
</script>

</body>
</html>
